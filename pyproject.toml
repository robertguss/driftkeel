[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "driftkeel"
dynamic = ["version"]
description = "Zero-Python Rust ML feature, prediction, and concept drift monitor (PSI, KS, Jensen-Shannon, missingness spikes, calibration ECE & HTML receipts)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Robert Guss" }]
keywords = ["ml", "drift", "monitoring", "psi", "cli", "keel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/robertguss/driftkeel"
Repository = "https://github.com/robertguss/driftkeel"
Issues = "https://github.com/robertguss/driftkeel/issues"

[tool.maturin]
bindings = "bin"
compatibility = "pypi"
strip = true
